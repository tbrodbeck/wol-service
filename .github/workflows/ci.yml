name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

jobs:
  test:
    name: Test & Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: build-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ env.MIX_ENV }}-

      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run Credo (static analysis)
        run: mix credo --strict

      - name: Run tests
        run: mix test

      - name: Run Dialyzer (type checking)
        run: mix dialyzer

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RASPI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H raspi-large >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull latest code
        run: ssh ${{ secrets.RASPI_USER }}@raspi-large "cd /home/t/wol_service && git pull origin main"

      - name: Install dependencies
        run: ssh ${{ secrets.RASPI_USER }}@raspi-large "cd /home/t/wol_service && mix deps.get --only prod"

      - name: Compile
        run: ssh ${{ secrets.RASPI_USER }}@raspi-large "cd /home/t/wol_service && MIX_ENV=prod mix compile"

      - name: Build assets
        run: ssh ${{ secrets.RASPI_USER }}@raspi-large "cd /home/t/wol_service && MIX_ENV=prod mix assets.deploy"

      - name: Restart service
        run: |
          ssh ${{ secrets.RASPI_USER }}@raspi-large "pkill -f 'mix phx.server' || true"
          sleep 2
          ssh ${{ secrets.RASPI_USER }}@raspi-large "cd /home/t/wol_service && export \$(grep -v '^#' .env | xargs) && nohup mix phx.server > /tmp/phoenix.log 2>&1 & sleep 1 && echo 'Started'"